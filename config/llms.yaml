# Model configs for run_surprisal.py
#
# repo_id   : Hugging Face Hub id. Fallback when no local copy exists (e.g. local machine).
# local_dir : (optional) folder name of a local copy. run_surprisal.py looks for it under
#             --model_dir (on the cluster: /local/common_models, set in run.sh).
# dtype     : precision the weights are loaded in ('float32' or 'bfloat16').

leo70b: # 80 layers, Llama-2 architecture
  repo_id: 'LeoLM/leo-hessianai-70b'
  local_dir: 'leo-hessianai-70b'
  dtype: 'bfloat16' # 70B weights are stored in 16 bit anyway
  surp_id: 'leo70b_surp'
  bpe_id: 'leo70b_bpe_split'
  ws_ind: '▁' # Unicode code point is U+2581, not U+005F
  char_repl: False
  bos_pad: False
  lang: 'de'

leo13b:
  repo_id: 'LeoLM/leo-hessianai-13b'
  dtype: 'float32'
  surp_id: 'leo13b_surp'
  bpe_id: 'leo13b_bpe_split'
  ws_ind: '▁' # Unicode code point is U+2581, not U+005F
  char_repl: False
  bos_pad: False
  lang: 'de'

